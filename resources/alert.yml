resources:
  alerts:
    fraud_critical_alert:
      display_name: "[fraud] critical monitoring alert"
      query_text: >-
        SELECT count(*) AS critical_alerts
        FROM ${var.catalog}.monitoring.alerts
        WHERE severity = 'critical'
          AND date = (SELECT max(date) FROM ${var.catalog}.monitoring.daily_metrics)
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: critical_alerts
          display: critical_alerts
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: UNPAUSED
        quartz_cron_schedule: "0 30 6 * * ?"
        timezone_id: UTC
      permissions:
        - level: CAN_RUN
          group_name: ${var.team_group}
