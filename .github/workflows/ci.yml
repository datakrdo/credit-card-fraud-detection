name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/ jobs/

      - name: Format check (ruff format)
        run: uv run ruff format --check src/ tests/ jobs/

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Dependency audit (pip-audit)
        run: |
          uv export --locked --no-hashes --all-extras --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps
